<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR датчики LEGO EV3</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0}
#hint{position:fixed;top:0;left:0;right:0;padding:10px;text-align:center;background:rgba(0,0,0,.55);color:#fff;font-family:sans-serif;z-index:10}
</style></head><body>
<div id="hint">Наведите камеру на картинку с датчиками</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiScanning: yes" color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 1.2" position="1 2 3"></a-entity>

  <a-entity mindar-image-target="targetIndex: 0">
    <!-- Размер метки = 1 по ширине. Положения подобраны под ваш рисунок (4 датчика в ряд). -->

    <!-- 1. Датчик касания -->
    <a-entity position="-0.35 0.12 0.08" scale="0.065 0.065 0.065">
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-box width="2.2" height="1.3" depth="1.6" color="#c9cacc"></a-box>
        <a-box width="0.9" height="0.28" depth="0.3" color="#d0221f" position="-0.5 0 0.95"></a-box>
        <a-box width="0.28" height="0.9" depth="0.3" color="#d0221f" position="-0.5 0 0.95"></a-box>
        <a-box width="1.5" height="0.5" depth="1.2" color="#c9cacc" position="-0.3 -0.9 0"></a-box>
      </a-entity>
    </a-entity>

    <!-- 2. Ультразвуковой датчик -->
    <a-entity position="-0.13 0.12 0.08" scale="0.065 0.065 0.065">
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-box width="2.4" height="1.2" depth="1.1" color="#15171a" position="0 0 0.5"></a-box>
        <a-box width="2.2" height="1.3" depth="0.9" color="#c9cacc" position="0 0.05 -0.5"></a-box>
        <a-torus radius="0.4" radius-tubular="0.1" color="#d0221f" position="-0.6 0 1.06"></a-torus>
        <a-torus radius="0.4" radius-tubular="0.1" color="#d0221f" position="0.6 0 1.06"></a-torus>
        <a-cylinder radius="0.32" height="0.12" color="#222" rotation="90 0 0" position="-0.6 0 1.02"></a-cylinder>
        <a-cylinder radius="0.32" height="0.12" color="#222" rotation="90 0 0" position="0.6 0 1.02"></a-cylinder>
      </a-entity>
    </a-entity>

    <!-- 3. Гироскопический датчик -->
    <a-entity position="0.12 0.12 0.08" scale="0.065 0.065 0.065">
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-box width="2.2" height="1.3" depth="1.6" color="#c9cacc"></a-box>
        <a-box width="0.03" height="1.32" depth="1.62" color="#222" position="0.05 0 0"></a-box>
        <a-box width="1.5" height="0.5" depth="1.2" color="#c9cacc" position="-0.3 -0.9 0"></a-box>
      </a-entity>
    </a-entity>

    <!-- 4. Датчик цвета -->
    <a-entity position="0.34 0.12 0.08" scale="0.065 0.065 0.065">
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-box width="2.2" height="1.3" depth="1.6" color="#c9cacc"></a-box>
        <a-torus radius="0.42" radius-tubular="0.08" color="#d0221f" position="-0.5 0 0.84"></a-torus>
        <a-cylinder radius="0.34" height="0.1" color="#222" rotation="90 0 0" position="-0.5 0 0.82"></a-cylinder>
        <a-box width="1.5" height="0.5" depth="1.2" color="#c9cacc" position="-0.3 -0.9 0"></a-box>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>
</body></html>
